<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cleaner Check-In</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 420px;
    margin: 40px auto;
    padding: 0 20px;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.subtitle { color: #666; margin-top: 0; font-size: 0.95rem; }
  label { display: block; margin-top: 16px; font-weight: 600; font-size: 0.9rem; }
  input[type="text"] {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    font-size: 1rem;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 6px;
  }
  .photo-section {
    margin-top: 18px;
    border: 2px dashed #94a3b8;
    border-radius: 8px;
    padding: 16px;
    text-align: center;
    background: #f8fafc;
  }
  .camera-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 12px;
    font-size: 1rem;
    font-weight: 600;
    border: 1px solid #16a34a;
    background: white;
    color: #16a34a;
    border-radius: 6px;
    cursor: pointer;
  }
  #photoPreviewContainer {
    display: none;
    margin-top: 12px;
    position: relative;
  }
  #photoPreview {
    width: 100%;
    max-height: 240px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid #cbd5e1;
  }
  .photo-badge {
    position: absolute;
    bottom: 10px;
    left: 10px;
    background: rgba(22, 163, 74, 0.9);
    color: white;
    font-size: 0.8rem;
    padding: 4px 8px;
    border-radius: 4px;
    font-weight: 600;
  }
  #checkinBtn {
    margin-top: 24px;
    width: 100%;
    padding: 14px;
    font-size: 1.05rem;
    font-weight: 600;
    border: none;
    border-radius: 6px;
    background: #16a34a;
    color: white;
    cursor: pointer;
  }
  button:disabled { background: #999; cursor: not-allowed; }
  #status {
    margin-top: 20px;
    padding: 12px;
    border-radius: 6px;
    font-size: 0.95rem;
    display: none;
  }
  #status.ok { background: #dcfce7; color: #166534; display: block; }
  #status.warn { background: #fef9c3; color: #854d0e; display: block; }
  #status.err { background: #fee2e2; color: #991b1b; display: block; }
</style>
</head>
<body>
  <h1>Cleaner Check-In</h1>
  <p class="subtitle">Enter your employee code, snap a selfie at your site, and tap check in.</p>

  <label for="employee_code">Employee Code</label>
  <input id="employee_code" type="text" placeholder="e.g. CL01" autocomplete="off" />

  <label>Live Photo Verification</label>
  <div class="photo-section">
    <input id="photoInput" type="file" accept="image/*" capture="user" style="display: none;" />
    <button type="button" class="camera-btn" id="takePhotoBtn">📸 Take Live Selfie</button>
    
    <div id="photoPreviewContainer">
      <img id="photoPreview" alt="Selfie preview" />
      <span class="photo-badge">Selfie Ready ✅</span>
    </div>
  </div>

  <button id="checkinBtn">Check In</button>

  <div id="status"></div>

  <script>
    const btn = document.getElementById('checkinBtn');
    const takePhotoBtn = document.getElementById('takePhotoBtn');
    const photoInput = document.getElementById('photoInput');
    const photoPreviewContainer = document.getElementById('photoPreviewContainer');
    const photoPreview = document.getElementById('photoPreview');
    const statusEl = document.getElementById('status');

    let capturedPhotoBase64 = null;

    function showStatus(type, text) {
      statusEl.className = type;
      statusEl.textContent = text;
    }

    takePhotoBtn.addEventListener('click', () => {
      photoInput.click();
    });

    // Client-side image compression so upload is fast & light
    function compressImage(file, maxWidth = 800, quality = 0.75) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    photoInput.addEventListener('change', async (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      try {
        showStatus('warn', 'Processing photo...');
        capturedPhotoBase64 = await compressImage(file, 800, 0.75);
        photoPreview.src = capturedPhotoBase64;
        photoPreviewContainer.style.display = 'block';
        takePhotoBtn.textContent = '📸 Retake Selfie';
        statusEl.style.display = 'none';
      } catch (err) {
        showStatus('err', 'Failed to process photo. Please try again.');
      }
    });

    btn.addEventListener('click', () => {
      const employee_code = document.getElementById('employee_code').value.trim();
      if (!employee_code) {
        showStatus('err', 'Please enter your employee code.');
        return;
      }

      if (!capturedPhotoBase64) {
        showStatus('err', 'Please take a live selfie photo before checking in.');
        return;
      }

      if (!navigator.geolocation) {
        showStatus('err', 'Your browser does not support location. Use a different device.');
        return;
      }

      btn.disabled = true;
      showStatus('warn', 'Getting your location...');

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const { latitude, longitude } = position.coords;
          try {
            showStatus('warn', 'Submitting check-in and photo...');
            const res = await fetch('/checkin', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                employee_code,
                latitude,
                longitude,
                photo: capturedPhotoBase64
              }),
            });

            let data;
            try {
              data = await res.json();
            } catch (jsonErr) {
              data = { error: 'Server error (' + res.status + ')' };
            }

            if (!res.ok) {
              showStatus('err', data.error || 'Check-in failed.');
            } else if (data.within_geofence === false) {
              showStatus('warn', data.message);
            } else {
              showStatus('ok', data.message || 'Checked in with photo! Waiting for PIC approval.');
            }
          } catch (err) {
            showStatus('err', err.message || 'Network error. Please try again.');
          } finally {
            btn.disabled = false;
          }
        },
        (geoErr) => {
          showStatus('err', 'Location permission denied or unavailable. Enable location and try again.');
          btn.disabled = false;
        },
        { enableHighAccuracy: true, timeout: 15000 }
      );
    });
  </script>
</body>
</html>
