<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cleaner Check-In</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 420px;
    margin: 40px auto;
    padding: 0 20px;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.subtitle { color: #666; margin-top: 0; }
  label { display: block; margin-top: 16px; font-weight: 600; font-size: 0.9rem; }
  input {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    font-size: 1rem;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 6px;
  }
  button {
    margin-top: 24px;
    width: 100%;
    padding: 14px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 6px;
    background: #16a34a;
    color: white;
    cursor: pointer;
  }
  button:disabled { background: #999; cursor: not-allowed; }
  #status {
    margin-top: 20px;
    padding: 12px;
    border-radius: 6px;
    font-size: 0.95rem;
    display: none;
  }
  #status.ok { background: #dcfce7; color: #166534; display: block; }
  #status.warn { background: #fef9c3; color: #854d0e; display: block; }
  #status.err { background: #fee2e2; color: #991b1b; display: block; }
</style>
</head>
<body>
  <h1>Cleaner Check-In</h1>
  <p class="subtitle">Enter your employee code and tap check in at your site.</p>

  <label for="employee_code">Employee Code</label>
  <input id="employee_code" type="text" placeholder="e.g. CLN-0123" autocomplete="off" />

  <button id="checkinBtn">Check In</button>

  <div id="status"></div>

  <script>
    const btn = document.getElementById('checkinBtn');
    const statusEl = document.getElementById('status');

    function showStatus(type, text) {
      statusEl.className = type;
      statusEl.textContent = text;
    }

    btn.addEventListener('click', () => {
      const employee_code = document.getElementById('employee_code').value.trim();
      if (!employee_code) {
        showStatus('err', 'Please enter your employee code.');
        return;
      }

      if (!navigator.geolocation) {
        showStatus('err', 'Your browser does not support location. Use a different device.');
        return;
      }

      btn.disabled = true;
      showStatus('warn', 'Getting your location...');

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const { latitude, longitude } = position.coords;
          try {
            showStatus('warn', 'Submitting check-in...');
            const res = await fetch('/checkin', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ employee_code, latitude, longitude }),
            });
            const data = await res.json();

            if (!res.ok) {
              showStatus('err', data.error || 'Check-in failed.');
            } else if (data.within_geofence === false) {
              showStatus('warn', data.message);
            } else {
              showStatus('ok', data.message || 'Checked in. Waiting for PIC approval.');
            }
          } catch (err) {
            showStatus('err', 'Network error. Please try again.');
          } finally {
            btn.disabled = false;
          }
        },
        (geoErr) => {
          showStatus('err', 'Location permission denied or unavailable. Enable location and try again.');
          btn.disabled = false;
        },
        { enableHighAccuracy: true, timeout: 15000 }
      );
    });
  </script>
</body>
</html>
