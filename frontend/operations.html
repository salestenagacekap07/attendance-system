<!DOCTYPE html>
<html lang='en'>
  <head>
    <meta charset='UTF-8' />
    <meta name='viewport' content='width=device-width, initial-scale=1.0' />
    <title>Operations Dashboard</title>
    <style>
      :root { --bg: #f4f7fb; --card: #ffffff; --primary: #1e3a8a; --text: #172033; --muted: #64748b; --border: #dfe7f1; --success: #166534; --success-bg: #dcfce7; --warning: #92400e; --warning-bg: #fef3c7; --danger: #991b1b; --danger-bg: #fee2e2; --gray: #e2e8f0; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Arial, sans-serif; background: var(--bg); color: var(--text); }
      .container { max-width: 1400px; margin: 24px auto; padding: 0 20px 40px; }
      .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
      h1 { margin: 0; font-size: 30px; }
      h2 { margin: 0; }
      .actions { display: flex; align-items: center; gap: 12px; }
      button { background: var(--primary); color: white; border: none; border-radius: 8px; padding: 10px 16px; cursor: pointer; font-weight: 600; }
      .secondary { background: #eef2ff; color: var(--primary); }
      .ghost { background: #e2e8f0; color: var(--text); }
      .danger { background: #ef4444; }
      .filters, .section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 20px; }
      .filter-grid, .inline-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
      label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
      select, input { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
      .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 20px; }
      .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
      .card .label { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
      .card .value { font-size: 28px; font-weight: 700; }
      .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
      .tiny { font-size: 12px; color: var(--muted); }
      .row-actions { display: flex; gap: 8px; }
      .status-badge { display: inline-block; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; }
      .pending { background: var(--warning-bg); color: var(--warning); }
      .approved { background: var(--success-bg); color: var(--success); }
      .rejected { background: var(--danger-bg); color: var(--danger); }
      .expired { background: var(--gray); color: var(--text); }
      table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--border); }
      th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--border); }
      th { background: #f8fafc; color: var(--muted); }
      .muted { color: var(--muted); }
      @media (max-width: 768px) { .topbar { display: block; } .actions { margin-top: 12px; } }
      @media print { .filters, .actions, .section { display: none !important; } .container { max-width: 100%; margin: 0; padding: 0; } }
    </style>
  </head>
  <body>
    <div class='container'>
      <div class='topbar'>
        <h1>Operations Dashboard</h1>
        <div class='actions'>
          <button class='secondary' id='refreshBtn'>Refresh</button>
          <button id='printBtn'>Export PDF</button>
        </div>
      </div>

      <div class='filters'>
        <form id='filterForm'>
          <div class='filter-grid'>
            <div><label for='clientFilter'>Client</label><select id='clientFilter'><option value=''>All clients</option></select></div>
            <div><label for='siteFilter'>Site</label><select id='siteFilter'><option value=''>All sites</option></select></div>
            <div><label for='statusFilter'>Status</label><select id='statusFilter'><option value=''>All statuses</option><option value='pending'>Pending</option><option value='approved'>Approved</option><option value='rejected'>Rejected</option><option value='expired'>Expired</option></select></div>
            <div><label for='dateFilter'>Date</label><input id='dateFilter' type='date' /></div>
            <div><label for='searchFilter'>Search</label><input id='searchFilter' type='text' placeholder='Cleaner, code, site' /></div>
            <div style='display:flex; align-items:flex-end;'><button type='submit'>Apply</button></div>
          </div>
        </form>
      </div>

      <div class='section'>
        <div class='section-header'>
          <h2>PIC Contact Manager</h2>
          <span class='tiny'>Update WhatsApp numbers here</span>
        </div>

        <form id='picForm'>
          <input type='hidden' id='picId' />
          <div class='inline-form'>
            <div>
              <label for='picClientSelect'>Client</label>
              <select id='picClientSelect'><option value=''>Select client</option></select>
            </div>
            <div>
              <label for='picSiteSelect'>Site</label>
              <select id='picSiteSelect'><option value=''>Select site</option></select>
            </div>
            <div>
              <label for='picName'>PIC Name</label>
              <input id='picName' type='text' placeholder='PIC name' />
            </div>
            <div>
              <label for='picNumber'>WhatsApp Number</label>
              <input id='picNumber' type='tel' placeholder='60123456789' />
            </div>
            <div style='display:flex; align-items:flex-end; gap:8px;'>
              <button type='submit'>Save PIC</button>
              <button type='button' id='cancelPicEdit' class='ghost'>Cancel</button>
            </div>
          </div>
        </form>

        <div style='margin-top:18px; overflow:auto;'>
          <table>
            <thead>
              <tr><th>Client</th><th>Site</th><th>PIC Name</th><th>WhatsApp Number</th><th>Action</th></tr>
            </thead>
            <tbody id='picTableBody'></tbody>
          </table>
        </div>
      </div>

      <div class='summary' id='summaryCards'></div>

      <div class='card' style='padding:0; overflow:hidden;'>
        <div style='padding:16px 18px; border-bottom:1px solid var(--border); color:var(--muted); font-size:14px;'><strong>Attendance Records</strong><span id='lastUpdated' class='muted' style='float:right;'></span></div>
        <div style='overflow:auto;'>
          <table>
            <thead>
              <tr><th>Cleaner</th><th>Employee Code</th><th>Client</th><th>Site</th><th>Time</th><th>Status</th><th>Distance</th><th>PIC</th></tr>
            </thead>
            <tbody id='attendanceBody'></tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      var summaryCards = document.getElementById('summaryCards');
      var attendanceBody = document.getElementById('attendanceBody');
      var clientFilter = document.getElementById('clientFilter');
      var siteFilter = document.getElementById('siteFilter');
      var statusFilter = document.getElementById('statusFilter');
      var dateFilter = document.getElementById('dateFilter');
      var searchFilter = document.getElementById('searchFilter');
      var lastUpdated = document.getElementById('lastUpdated');
      var picClientSelect = document.getElementById('picClientSelect');
      var picSiteSelect = document.getElementById('picSiteSelect');
      var picNameInput = document.getElementById('picName');
      var picNumberInput = document.getElementById('picNumber');
      var picIdInput = document.getElementById('picId');
      var picTableBody = document.getElementById('picTableBody');

      function normalizeNumber(value) {
        var digits = (value || '').replace(/\D/g, '');
        if (!digits) return '';
        if (digits.startsWith('0')) return '6' + digits.slice(1);
        if (digits.startsWith('60')) return digits;
        if (digits.startsWith('6')) return digits;
        return digits;
      }

      function badgeClass(status) { return status || 'pending'; }
      function formatDate(dateString) { if (!dateString) return '—'; return new Date(dateString).toLocaleString('en-MY', { timeZone: 'Asia/Kuala_Lumpur' }); }
      function renderSummary(data) {
        var cards = [
          ['Clients', data.client_count || 0],
          ['Sites', data.site_count || 0],
          ['Cleaners', data.cleaner_count || 0],
          ['Total Check-ins', data.total_checkins || 0],
          ['Pending', data.pending_count || 0],
          ['Approved', data.approved_count || 0],
          ['Rejected', data.rejected_count || 0]
        ];
        summaryCards.innerHTML = cards.map(function (item) {
          var label = item[0];
          var value = item[1];
          return '<div class='card'><div class='label'>' + label + '</div><div class='value'>' + value + '</div></div>';
        }).join('');
      }
      function renderRows(rows) {
        if (!rows.length) {
          attendanceBody.innerHTML = '<tr><td colspan='8' style='padding:20px; color:#64748b;'>No attendance records found.</td></tr>';
          return;
        }
        attendanceBody.innerHTML = rows.map(function (row) {
          var cleanerName = row.cleaner_name || '—';
          var employeeCode = row.employee_code || '—';
          var clientName = row.client_name || '—';
          var siteName = row.site_name || '—';
          var picName = row.pic_name || '—';
          var distance = row.distance_meters ? (Math.round(row.distance_meters) + 'm') : '—';
          return '<tr><td><strong>' + cleanerName + '</strong></td><td>' + employeeCode + '</td><td>' + clientName + '</td><td>' + siteName + '</td><td>' + formatDate(row.created_at) + '</td><td><span class='status-badge ' + badgeClass(row.status) + ''>' + (row.status || 'pending') + '</span></td><td>' + distance + '</td><td>' + picName + '</td></tr>';
        }).join('');
      }
      async function loadClients() {
        var res = await fetch('/api/operations/clients');
        var clients = await res.json();
        clientFilter.innerHTML = '<option value=''>All clients</option>' + clients.map(function (client) { return '<option value='' + client.id + ''>' + client.name + '</option>'; }).join('');
        picClientSelect.innerHTML = '<option value=''>Select client</option>' + clients.map(function (client) { return '<option value='' + client.id + ''>' + client.name + '</option>'; }).join('');
      }
      async function loadSites(clientId) {
        var url = '/api/operations/sites';
        if (clientId) url = '/api/operations/sites?client_id=' + encodeURIComponent(clientId);
        var res = await fetch(url);
        var sites = await res.json();
        siteFilter.innerHTML = '<option value=''>All sites</option>' + sites.map(function (site) { return '<option value='' + site.id + ''>' + site.name + '</option>'; }).join('');
        picSiteSelect.innerHTML = '<option value=''>Select site</option>' + sites.map(function (site) { return '<option value='' + site.id + ''>' + site.name + '</option>'; }).join('');
      }
      async function loadPics() {
        var params = new URLSearchParams();
        if (picClientSelect.value) params.set('client_id', picClientSelect.value);
        if (picSiteSelect.value) params.set('site_id', picSiteSelect.value);
        var url = '/api/operations/pics' + (params.toString() ? '?' + params.toString() : '');
        var res = await fetch(url);
        var pics = await res.json();
        if (!pics.length) {
          picTableBody.innerHTML = '<tr><td colspan='5' style='padding:18px; color:#64748b;'>No PICs found for this site.</td></tr>';
          return;
        }
        picTableBody.innerHTML = pics.map(function (pic) {
          return '<tr><td>' + (pic.site_name || '—') + '</td><td>' + (pic.site_name || '—') + '</td><td>' + (pic.name || '—') + '</td><td>' + (pic.whatsapp_number || '—') + '</td><td><div class='row-actions'><button type='button' class='secondary' data-edit='' + pic.id + ''>Edit</button><button type='button' class='danger' data-delete='' + pic.id + ''>Delete</button></div></td></tr>';
        }).join('');
      }
      async function loadData() {
        var params = new URLSearchParams();
        if (clientFilter.value) params.set('client_id', clientFilter.value);
        if (siteFilter.value) params.set('site_id', siteFilter.value);
        if (statusFilter.value) params.set('status', statusFilter.value);
        if (dateFilter.value) params.set('date', dateFilter.value);
        if (searchFilter.value.trim()) params.set('search', searchFilter.value.trim());
        var summaryRes = await fetch('/api/operations/summary?' + params.toString());
        var summary = await summaryRes.json();
        renderSummary(summary);
        var attendanceRes = await fetch('/api/operations/attendance?' + params.toString());
        var attendance = await attendanceRes.json();
        renderRows(attendance.rows || []);
        lastUpdated.textContent = 'Updated ' + new Date().toLocaleTimeString('en-MY', { timeZone: 'Asia/Kuala_Lumpur' });
      }
      document.getElementById('filterForm').addEventListener('submit', function (e) { e.preventDefault(); loadData(); });
      document.getElementById('refreshBtn').addEventListener('click', function () { loadData(); loadPics(); });
      document.getElementById('printBtn').addEventListener('click', function () { window.print(); });
      clientFilter.addEventListener('change', async function () { await loadSites(clientFilter.value); loadData(); });
      picClientSelect.addEventListener('change', async function () { await loadSites(picClientSelect.value); await loadPics(); });
      picSiteSelect.addEventListener('change', function () { loadPics(); });
      document.getElementById('cancelPicEdit').addEventListener('click', function () {
        picIdInput.value = '';
        picNameInput.value = '';
        picNumberInput.value = '';
      });
      document.getElementById('picForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        if (!picSiteSelect.value) {
          alert('Please select a site first.');
          return;
        }
        var payload = {
          site_id: picSiteSelect.value,
          name: picNameInput.value.trim(),
          whatsapp_number: normalizeNumber(picNumberInput.value)
        };
        if (!payload.name || !payload.whatsapp_number) {
          alert('Please enter the PIC name and WhatsApp number.');
          return;
        }
        var method = picIdInput.value ? 'PUT' : 'POST';
        var url = picIdInput.value ? '/api/operations/pics/' + encodeURIComponent(picIdInput.value) : '/api/operations/pics';
        var res = await fetch(url, {
          method: method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        var json = await res.json();
        if (!res.ok) {
          alert(json.error || 'Failed to save PIC.');
          return;
        }
        picIdInput.value = '';
        picNameInput.value = '';
        picNumberInput.value = '';
        await loadPics();
        await loadData();
      });
      picTableBody.addEventListener('click', async function (e) {
        var editId = e.target.getAttribute('data-edit');
        var deleteId = e.target.getAttribute('data-delete');
        if (editId) {
          var res = await fetch('/api/operations/pics?site_id=' + encodeURIComponent(picSiteSelect.value || ''));
          var pics = await res.json();
          var pic = pics.find(function (item) { return String(item.id) === String(editId); });
          if (!pic) return;
          picIdInput.value = pic.id;
          picNameInput.value = pic.name;
          picNumberInput.value = pic.whatsapp_number;
          picSiteSelect.value = String(pic.site_id);
          return;
        }
        if (deleteId) {
          if (!confirm('Delete this PIC?')) return;
          var res = await fetch('/api/operations/pics/' + encodeURIComponent(deleteId), { method: 'DELETE' });
          if (res.ok) {
            await loadPics();
            await loadData();
          }
        }
      });
      async function init() { await loadClients(); await loadSites(); await loadPics(); await loadData(); setInterval(loadData, 30000); }
      init();
    </script>
  </body>
</html>
